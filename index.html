<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>47都道府県マスター × Google認証</title>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary-color: #3B82F6;
            --primary-hover: #2563EB;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-color: #1F2937;
            --correct-color: #10B981;
            --incorrect-color: #EF4444;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        h1, h2, h3 {
            text-align: center;
            margin-top: 0;
        }

        .hidden { display: none !important; }

        /* ユーザープロフィールバー */
        .user-bar {
            background-color: #EFF6FF;
            border: 1px solid #BFDBFE;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        /* ボタン共通スタイル */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            width: 100%;
            margin-bottom: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn:active {
            transform: scale(0.98);
            background-color: var(--primary-hover);
        }

        .btn-secondary { background-color: #6B7280; }
        .btn-retry { background-color: #F59E0B; }
        .btn-ranking { background-color: #8B5CF6; }

        .text-input {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #D1D5DB;
            border-radius: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .grid-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 12px 20px;
            background: #EFF6FF;
            border-radius: 10px;
        }

        .question-box {
            text-align: center;
            margin: 15px 0;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .question-sub {
            font-size: 1.2rem;
            color: #4B5563;
            margin-bottom: 10px;
        }

        .question-main-text {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .map-img {
            max-width: 170px;
            max-height: 170px;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.15));
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .map-img-option {
            max-width: 100%;
            max-height: 110px;
            object-fit: contain;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.12));
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .answers-grid.disabled {
            pointer-events: none;
            opacity: 0.8;
        }

        .ans-btn {
            background-color: #F3F4F6;
            color: var(--text-color);
            border: 2px solid #E5E7EB;
            padding: 8px;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 130px;
            gap: 6px;
        }

        .ans-btn:active { background-color: #E5E7EB; }

        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
        }

        .feedback-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .feedback-title.correct { color: var(--correct-color); }
        .feedback-title.incorrect { color: var(--incorrect-color); }

        .feedback-msg {
            font-size: 1.5rem;
            line-height: 1.5;
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }

        .rank-display {
            font-size: 4.5rem;
            font-weight: 900;
            color: #EF4444;
            margin: 5px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .result-detail {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        /* ランキングテーブル表示エリア */
        .ranking-list {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .ranking-list th, .ranking-list td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #E5E7EB;
        }

        .ranking-list th {
            background-color: #F9FAFB;
            color: #4B5563;
        }

</head>
<body>

<div class="container">
    <!-- 0. Googleログイン画面 -->
    <div id="login-screen">
        <h1>47都道府県マスター</h1>
        <p style="text-align: center; color: #4B5563; margin-bottom: 24px;">
            クラスルームのGoogleアカウントでログインしましょう。
        </p>
        <div style="display: flex; justify-content: center;">
            <div id="g_id_onload"
                 data-client_id="496219769396-tdnpkmf1dt1h25jj1b9ovho3pc63he42.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large"></div>
        </div>
    </div>

    <!-- 0.5 プレイヤーネーム初回登録画面 -->
    <div id="register-screen" class="hidden">
        <h2>プレイヤー登録</h2>
        <p style="text-align: center; color: #4B5563;">自分の名前を入力してください。</p>
        <input type="text" id="player-name-input" class="text-input" placeholder="例: しゅん">
        <button class="btn" onclick="submitPlayerName()">登録して進む</button>
    </div>

    <!-- 1. 設定・スタート画面 -->
    <div id="setup-screen" class="hidden">
        <div class="user-bar">
            <div>プレイヤー: <strong id="user-display-name">-</strong></div>
            <div>合計スコア: <strong id="user-display-score">0</strong>点 (<span id="user-display-rank">-</span>)</div>
        </div>

        <h1>47都道府県マスター</h1>
        
        <button class="btn btn-ranking" onclick="showRankingModal()">🏆 ランキングを見る</button>

        <h3>1. 出題形式を選択</h3>
        <div class="grid-select">
            <button class="btn mode-btn" data-mode="shape-to-name">形 ➔ 名前</button>
            <button class="btn mode-btn btn-secondary" data-mode="name-to-shape">名前 ➔ 形</button>
            <button class="btn mode-btn btn-secondary" data-mode="feat-to-name">特徴 ➔ 名前</button>
            <button class="btn mode-btn btn-secondary" data-mode="name-to-feat">名前 ➔ 特徴</button>
            <button class="btn mode-btn btn-secondary" data-mode="name-to-capital">名前 ➔ 県庁所在地</button>
            <button class="btn mode-btn btn-secondary" data-mode="capital-to-name">県庁所在地 ➔ 名前</button>
            <button class="btn mode-btn btn-secondary" data-mode="diff-name-to-capital">【難問】名前 ➔ 県庁所在地(異名のみ)</button>
            <button class="btn mode-btn btn-secondary" data-mode="diff-capital-to-name">【難問】県庁所在地 ➔ 名前(異名のみ)</button>
        </div>

        <h3>2. 対象エリアを選択</h3>
        <div class="grid-select" id="region-select-container">
            <button class="btn region-btn" data-region="all">全国 (47都道府県)</button>
            <button class="btn region-btn btn-secondary" data-region="hokkaido_tohoku">北海道・東北</button>
            <button class="btn region-btn btn-secondary" data-region="kanto">関東</button>
            <button class="btn region-btn btn-secondary" data-region="chubu">中部</button>
            <button class="btn region-btn btn-secondary" data-region="kinki">近畿</button>
            <button class="btn region-btn btn-secondary" data-region="chugoku_shikoku">中国・四国</button>
            <button class="btn region-btn btn-secondary" data-region="kyushu">九州・沖縄</button>
        </div>

        <button id="start-btn" class="btn" style="background-color: #10B981; margin-top: 10px;">スタート！</button>
    </div>

    <!-- 1.5 ランキング表示モーダル -->
    <div id="ranking-modal" class="feedback-overlay hidden">
        <h2>🏆 スコアランキング TOP 10</h2>
        <div style="width: 100%; max-height: 300px; overflow-y: auto;">
            <table class="ranking-list">
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>名前</th>
                        <th>合計スコア</th>
                    </tr>
                </thead>
                <tbody id="ranking-table-body">
                    <!-- JSで動的挿入 -->
                </tbody>
            </table>
        </div>
        <button class="btn btn-secondary" style="margin-top: 15px;" onclick="closeRankingModal()">閉じる</button>
    </div>

    <!-- 2. クイズ実行画面 -->
    <div id="quiz-screen" class="hidden">
        <div class="status-bar">
            <span id="progress-text">問題: 1 / 10</span>
            <span id="timer-text">タイム: 0.0s</span>
        </div>

        <div class="question-box">
            <div id="q-sub" class="question-sub"></div>
            <div id="q-main"></div>
        </div>

        <div id="answers-grid" class="answers-grid">
            <button class="btn ans-btn" onclick="checkAnswer(0)"></button>
            <button class="btn ans-btn" onclick="checkAnswer(1)"></button>
            <button class="btn ans-btn" onclick="checkAnswer(2)"></button>
            <button class="btn ans-btn" onclick="checkAnswer(3)"></button>
        </div>

        <!-- 一問ごとの判定ポップアップ (1.0秒で自動消失) -->
        <div id="feedback-modal" class="feedback-overlay hidden">
            <div id="fb-title" class="feedback-title">正解！</div>
            <div id="fb-msg" class="feedback-msg"></div>
        </div>
    </div>

    <!-- 3. 結果発表画面 -->
    <div id="result-screen" class="hidden">
        <h2>結果発表</h2>
        <div class="result-box">
            <div>あなたのランク</div>
            <div id="rank-text" class="rank-display">SSS</div>
            <div id="save-status-text" style="color: var(--primary-color); font-weight: bold; margin-bottom: 8px;"></div>
            <div id="result-details" class="result-detail"></div>
            
            <button id="retry-missed-btn" class="btn btn-retry hidden" onclick="startRetryMode()">間違えた問題だけ再挑戦</button>
            <button class="btn" onclick="resetGame()">最初に戻る</button>
        </div>
    </div>
</div>

    { name: "沖縄県", capital: "那覇市", region: "kyushu", img: "https://www.chizu-seisaku.com/wp-content/uploads/2020/09/d_okinawa.png", feat: "首里城・ゴーヤチャンプルー・美ら海水族館" }

let currentMode = "shape-to-name";
let currentRegion = "all";
let questions = [];
let missedQuestions = [];
let currentQIndex = 0;
let correctCount = 0;
let startTime = 0;
let timerInterval = null;
let elapsedTime = 0;
let currentCorrectAnswerStr = "";

// --- 通信用汎用関数 ---
async function sendApi(data) {
    try {
        data.idToken = idToken;
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(data)
        });
        return await res.json();
    } catch (e) {
        return { status: "error", message: e.toString() };
    }
}

// --- Google認証連携処理 ---
async function handleCredentialResponse(response) {
    idToken = response.credential;
    const res = await sendApi({ action: "getProfile" });

    if (res.status === "success") {
        document.getElementById("login-screen").classList.add("hidden");
        if (res.isRegistered) {
            userProfile.playerName = res.playerName;
            userProfile.totalScore = res.totalScore || 0;
            userProfile.bestRank = res.bestRank;
            userProfile.modeScores = res.modeScores || {};
            updateUserUI();
            document.getElementById("setup-screen").classList.remove("hidden");
        } else {
            document.getElementById("register-screen").classList.remove("hidden");
        }
    } else {
        alert("認証エラー: " + res.message);
    }
}

async function submitPlayerName() {
    const name = document.getElementById("player-name-input").value;
    if (!name) return alert("名前を入力してください");

    const res = await sendApi({ action: "savePlayerName", playerName: name });
    if (res.status === "success") {
        userProfile.playerName = res.playerName;
        userProfile.totalScore = 0;
        userProfile.bestRank = "-";
        userProfile.modeScores = {};
        updateUserUI();
        document.getElementById("register-screen").classList.add("hidden");
        document.getElementById("setup-screen").classList.remove("hidden");
    } else {
        alert("登録エラー: " + res.message);
    }
}

function updateUserUI() {
    document.getElementById("user-display-name").innerText = userProfile.playerName;
    document.getElementById("user-display-score").innerText = userProfile.totalScore;
    document.getElementById("user-display-rank").innerText = userProfile.bestRank;
}

// ランキング表示処理
async function showRankingModal() {
    const modal = document.getElementById("ranking-modal");
    const tbody = document.getElementById("ranking-table-body");
    tbody.innerHTML = '<tr><td colspan="3">読み込み中...</td></tr>';
    modal.classList.remove("hidden");

    const res = await sendApi({ action: "getRanking" });
    if (res.status === "success") {
        tbody.innerHTML = "";
        if (!res.ranking || res.ranking.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3">ランキングデータがありません。</td></tr>';
            return;
        }
        res.ranking.forEach((item, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.playerName}</td>
                <td><strong>${item.totalScore}</strong>点</td>
            `;
            tbody.appendChild(tr);
        });
    } else {
        tbody.innerHTML = '<tr><td colspan="3">読み込みエラーが発生しました。</td></tr>';
    }
}

function closeRankingModal() {
    document.getElementById("ranking-modal").classList.add("hidden");
}

// 都道府県名と県庁所在地名が異なるものを判定するヘルパー関数
function isDifferentCapital(item) {
    const prefBase = item.name.replace(/(都|道|府|県)$/, '');
    const capBase = item.capital.replace(/(市|区)$/, '');
    return prefBase !== capBase;
}

// 配列のシャッフル関数
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

const modeBtns = document.querySelectorAll('.mode-btn');
const regionBtns = document.querySelectorAll('.region-btn');

modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        modeBtns.forEach(b => b.classList.add('btn-secondary'));
        btn.classList.remove('btn-secondary');
        currentMode = btn.dataset.mode;
    });
});

regionBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        regionBtns.forEach(b => b.classList.add('btn-secondary'));
        btn.classList.remove('btn-secondary');
        currentRegion = btn.dataset.region;
    });
});

document.getElementById('start-btn').addEventListener('click', startGame);

function startGame() {
    let pool = [...prefData];

    if (currentMode === 'diff-name-to-capital' || currentMode === 'diff-capital-to-name') {
        pool = pool.filter(isDifferentCapital);
    } else {
        if (currentRegion !== 'all') {
            pool = pool.filter(p => p.region === currentRegion);
        }
    }

    questions = shuffle([...pool]);
    missedQuestions = [];
    currentQIndex = 0;
    correctCount = 0;

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');

    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 100);

    showQuestion();
}

function startRetryMode() {
    questions = shuffle([...missedQuestions]);
    missedQuestions = [];
    currentQIndex = 0;
    correctCount = 0;

    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');

    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 100);

    showQuestion();
}

function updateTimer() {
    elapsedTime = (Date.now() - startTime) / 1000;
    document.getElementById('timer-text').innerText = `タイム: ${elapsedTime.toFixed(1)}s`;
}

function showQuestion() {
    document.getElementById('answers-grid').classList.remove('disabled');

    const q = questions[currentQIndex];
    document.getElementById('progress-text').innerText = `問題: ${currentQIndex + 1} / ${questions.length}`;

    const qSub = document.getElementById('q-sub');
    const qMain = document.getElementById('q-main');

    let correctAnswerObj = null;
    let wrongChoices = [];

    if (currentMode === 'shape-to-name') {
        qSub.innerText = "この形が表す都道府県は？";
        qMain.innerHTML = `<img src="${q.img}" class="map-img" alt="都道府県の形" onerror="this.onerror=null; this.alt='画像エラー';">`;
        correctAnswerObj = { type: 'name-only', name: q.name };
        currentCorrectAnswerStr = q.name;
        wrongChoices = getWrongChoices(q).map(p => ({ type: 'name-only', name: p.name }));

    } else if (currentMode === 'name-to-shape') {
        qSub.innerText = `「${q.name}」の形はどれ？`;
        qMain.innerText = "";
        correctAnswerObj = { type: 'img-only', img: q.img, name: q.name };
        currentCorrectAnswerStr = `${q.name}の形`;
        wrongChoices = getWrongChoices(q).map(p => ({ type: 'img-only', img: p.img, name: p.name }));

    } else if (currentMode === 'feat-to-name') {
        qSub.innerText = "この特徴・名産品を持つ都道府県は？";
        qMain.innerHTML = `<div class="question-main-text">「${q.feat}」</div>`;
        correctAnswerObj = { type: 'name-with-img', name: q.name, img: q.img };
        currentCorrectAnswerStr = q.name;
        wrongChoices = getWrongChoices(q).map(p => ({ type: 'name-with-img', name: p.name, img: p.img }));

    } else if (currentMode === 'name-to-feat') {
        qSub.innerText = "この都道府県の特徴・名産品はどれ？";
        qMain.innerHTML = `
            <img src="${q.img}" class="map-img" alt="${q.name}" onerror="this.onerror=null; this.alt='画像エラー';">
            <div class="question-main-text">「${q.name}」</div>
        `;
        correctAnswerObj = { type: 'text-only', text: q.feat, id: q.name };
        currentCorrectAnswerStr = q.feat;
        wrongChoices = getWrongChoices(q).map(p => ({ type: 'text-only', text: p.feat, id: p.name }));

    } else if (currentMode === 'name-to-capital' || currentMode === 'diff-name-to-capital') {
        qSub.innerText = "この都道府県の「県庁所在地」はどこ？";
        qMain.innerHTML = `
            <img src="${q.img}" class="map-img" alt="${q.name}" onerror="this.onerror=null; this.alt='画像エラー';">
            <div class="question-main-text">「${q.name}」</div>
        `;
        correctAnswerObj = { type: 'text-only', text: q.capital, id: q.name };
        currentCorrectAnswerStr = q.capital;
        wrongChoices = getWrongChoices(q).map(p => ({ type: 'text-only', text: p.capital, id: p.name }));

    } else if (currentMode === 'capital-to-name' || currentMode === 'diff-capital-to-name') {
        qSub.innerText = "この県庁所在地がある都道府県はどこ？";
        qMain.innerHTML = `<div class="question-main-text">「${q.capital}」</div>`;
        correctAnswerObj = { type: 'name-with-img', name: q.name, img: q.img };
        currentCorrectAnswerStr = q.name;
        wrongChoices = getWrongChoices(q).map(p => ({ type: 'name-with-img', name: p.name, img: p.img }));
    }

    const choices = shuffle([correctAnswerObj, ...wrongChoices]);
    const ansBtns = document.querySelectorAll('.ans-btn');

    ansBtns.forEach((btn, idx) => {
        const item = choices[idx];
        
        if (item.type === 'name-only') {
            btn.innerHTML = `<span>${item.name}</span>`;
            btn.dataset.correct = (item.name === q.name) ? "true" : "false";

        } else if (item.type === 'img-only') {
            btn.innerHTML = `<img src="${item.img}" class="map-img-option" alt="選択肢" onerror="this.onerror=null; this.alt='画像エラー';">`;
            btn.dataset.correct = (item.name === q.name) ? "true" : "false";

        } else if (item.type === 'name-with-img') {
            btn.innerHTML = `
                <img src="${item.img}" class="map-img-option" alt="${item.name}" onerror="this.onerror=null; this.alt='画像エラー';">
                <span>${item.name}</span>
            `;
            btn.dataset.correct = (item.name === q.name) ? "true" : "false";

        } else if (item.type === 'text-only') {
            btn.innerHTML = `<span>${item.text}</span>`;
            btn.dataset.correct = (item.id === q.name) ? "true" : "false";
        }
    });
}

function getWrongChoices(correctObject) {
    let pool = prefData;

    if (currentMode === 'diff-name-to-capital' || currentMode === 'diff-capital-to-name') {
        pool = prefData.filter(isDifferentCapital);
    }

    let candidates = [];
    
    if (currentRegion !== 'all' && !(currentMode === 'diff-name-to-capital' || currentMode === 'diff-capital-to-name')) {
        candidates = pool.filter(p => p.region === correctObject.region && p.name !== correctObject.name);
    }

    if (candidates.length < 3) {
        candidates = pool.filter(p => p.name !== correctObject.name);
    }

    const shuffled = shuffle(candidates);
    return [shuffled[0], shuffled[1], shuffled[2]];
}

function checkAnswer(btnIndex) {
    document.getElementById('answers-grid').classList.add('disabled');

    const btns = document.querySelectorAll('.ans-btn');
    const isCorrect = btns[btnIndex].dataset.correct === "true";
    const currentQ = questions[currentQIndex];

    const fbModal = document.getElementById('feedback-modal');
    const fbTitle = document.getElementById('fb-title');
    const fbMsg = document.getElementById('fb-msg');

    if (isCorrect) {
        correctCount++;
        fbTitle.innerText = "正解！ ⭕";
        fbTitle.className = "feedback-title correct";
        fbMsg.innerText = "";
    } else {
        missedQuestions.push(currentQ);
        fbTitle.innerText = "不正解… ❌";
        fbTitle.className = "feedback-title incorrect";
        fbMsg.innerHTML = `正解は <strong>「${currentCorrectAnswerStr}」</strong> です`;
    }

    fbModal.classList.remove('hidden');

    setTimeout(() => {
        fbModal.classList.add('hidden');
        currentQIndex++;
        if (currentQIndex < questions.length) {
            showQuestion();
        } else {
            endGame();
        }
    }, 1000);
}

// ゲーム終了・スコア計算・結果保存処理
async function endGame() {
    clearInterval(timerInterval);

    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    const totalQ = questions.length;
    const accuracy = (correctCount / totalQ) * 100;
    
    // スコア計算公式: (正解数 * 10) + (タイムボーナス)
    const baseScore = correctCount * 10;
    const timeBonus = Math.max(0, Math.floor(100 - elapsedTime));
    const score = accuracy === 100 ? baseScore + timeBonus : baseScore;

    // ランク判定
    let rank = "C";
    if (accuracy === 100 && elapsedTime < 30) rank = "SSS";
    else if (accuracy === 100 && elapsedTime < 50) rank = "SS";
    else if (accuracy >= 90) rank = "S";
    else if (accuracy >= 70) rank = "A";
    else if (accuracy >= 50) rank = "B";

    document.getElementById('rank-text').innerText = rank;
    document.getElementById('result-details').innerHTML = `
        正解数: ${correctCount} / ${totalQ}<br>
        タイム: ${elapsedTime.toFixed(1)}秒<br>
        獲得スコア: <strong>${score}</strong>点
    `;

    // 誤答がある場合は再挑戦ボタンを表示
    const retryBtn = document.getElementById('retry-missed-btn');
    if (missedQuestions.length > 0) {
        retryBtn.classList.remove('hidden');
    } else {
        retryBtn.classList.add('hidden');
    }

    // スコア保存API呼び出し
    const saveStatus = document.getElementById('save-status-text');
    saveStatus.innerText = "スコアを保存中...";

    const res = await sendApi({
        action: "saveResult",
        mode: currentMode,
        score: score,
        rank: rank
    });

    if (res.status === "success") {
        userProfile.totalScore = res.totalScore;
        updateUserUI();
        if (res.isNewRecord) {
            saveStatus.innerText = "🎉 ハイスコア更新！保存が完了しました。";
        } else {
            saveStatus.innerText = "スコアを保存しました。";
        }
    } else {
        saveStatus.innerText = "スコア保存エラー: " + (res.message || "通信失敗");
    }
}

function resetGame() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
}
